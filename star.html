<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>try{var a=localStorage.getItem("site-accent");if(a&&a!=="red")document.documentElement.dataset.accent=a}catch(e){}</script>
<meta name="theme-color" content="#0C0C0C">
<title>巨星介绍 · 体育人物与体育精神</title>
<link rel="stylesheet" href="css/design.css">
<style>
  .page { padding-top: calc(var(--nav-h) + 40px); }
  .star-layout { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: clamp(26px, 4vw, 56px); align-items: start; }
  @media (max-width: 900px) { .star-layout { grid-template-columns: 1fr; } }
  .star-photo { position: relative; border-radius: var(--radius); overflow: hidden;
    border: 1.5px solid var(--card-line); background: var(--surface-2);
    aspect-ratio: 3 / 4; box-shadow: 0 22px 54px rgba(0, 0, 0, 0.5); }
  .star-photo img { width: 100%; height: 100%; object-fit: cover; }
  .star-photo::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 55%, rgba(0, 0, 0, 0.55)); pointer-events: none; }
  .star-photo .init-card { width: 100%; height: 100%; font-size: 96px; }
  .star-eyebrow { font-family: var(--font-display); color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: 4px; margin-bottom: 14px; }
  .star-head h1 { font-size: clamp(32px, 4.2vw, 52px); font-weight: 900; letter-spacing: -0.5px; line-height: 1.15; }
  .star-head .en { font-family: var(--mono); color: var(--faint); font-size: 14px; letter-spacing: 1px; margin-top: 6px; }
  .star-titles { color: var(--accent-tint); font-size: 15px; font-weight: 600; margin: 14px 0 4px; }
  .star-body p { color: var(--muted); font-size: 15px; margin: 14px 0; max-width: 62ch; }
  .star-body .saying { color: var(--text); font-weight: 600; }
  .quote-band { border-left: 3px solid rgba(215, 226, 234, 0.35); padding: 6px 0 6px 18px; margin: 22px 0; }
  .quote-band .zh { font-size: 17px; font-weight: 700; line-height: 1.6; }
  .quote-band .orig { font-family: var(--mono); color: var(--faint); font-size: 12.5px; margin-top: 8px; }
  .star-kw { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .star-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
  .star-missing { text-align: center; color: var(--faint); padding: 90px 0; }
  .star-missing b { display: block; font-size: 20px; color: var(--muted); margin-bottom: 10px; }
</style>
</head>
<body>
<section class="page">
  <div class="wrap" id="box">
    <div class="star-missing">加载中…</div>
  </div>
</section>
<script src="js/components.js"></script>
<script>
(async () => {
  const name = new URLSearchParams(location.search).get("name");
  const legends = await loadJSON("legends.json");
  const box = document.getElementById("box");
  const star = legends.find((x) => x.name === name);

  if (!star) {
    box.innerHTML = `
      <div class="star-missing">
        <b>没有找到这位巨星</b>
        <a class="btn btn-ghost" href="index.html">返回首页</a>
      </div>`;
    return;
  }

  /* 该传奇是否出现在某个精神主题里 → 给出深链 */
  const themes = await loadJSON("spirit_themes.json");
  const theme = themes.find((t) => t.heroes.includes(star.name));

  /* 故事里内嵌的「名言：……」拆出来单独排版 */
  const [narrative, saying] = star.story.split(/名言：/);
  const photoHtml = star.photo
    ? `<img src="data/${star.photo}" alt="${star.name}" onerror="this.remove();this.parentElement.insertAdjacentHTML('beforeend','<span class=init-card>${star.name[0]}</span>')">`
    : `<span class="init-card">${star.name[0]}</span>`;

  box.innerHTML = `
    <div class="star-layout">
      <div class="star-photo">${photoHtml}</div>
      <div>
        <div class="star-eyebrow">LEGEND · ${star.sport || ""} · ${star.country || ""} · ${star.era || ""}</div>
        <div class="star-head">
          <h1>${star.name}</h1>
          <div class="en">${star.en || ""}</div>
        </div>
        <p class="star-titles">${star.titles || ""}</p>
        <div class="star-body">
          ${narrative ? `<p>${narrative.trim()}</p>` : ""}
          ${saying ? `<p class="saying">名言：${saying.trim()}</p>` : ""}
        </div>
        <div class="quote-band">
          <div class="zh">「${star.quote_zh}」</div>
          <div class="orig">${star.quote || ""}</div>
        </div>
        <div class="star-kw">${(star.spirit || []).map((k) => `<span class="tag gold">${k}</span>`).join("")}</div>
        <div class="star-links">
          <a class="btn btn-primary" href="match.html?q=${encodeURIComponent(star.name)}">查看精神画像 <span class="arr">→</span></a>
          ${theme ? `<a class="btn btn-ghost" href="spirit.html?hero=${encodeURIComponent(star.name)}">所属精神主题：${theme.title}</a>` : ""}
          <a class="btn btn-ghost" href="index.html">返回封面流</a>
        </div>
      </div>
    </div>`;
  document.title = `${star.name} · 体育人物与体育精神`;
})().catch(() => showLoadError());
</script>
</body>
</html>
