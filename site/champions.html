<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国冠军环形画廊 · 体育人物与体育精神</title>
<link rel="stylesheet" href="css/design.css">
<style>
  .page { padding-top: calc(var(--nav-h) + 40px); }
  .ring-layout { display: grid; grid-template-columns: 1.25fr 1fr; gap: 26px; align-items: center; }
  @media (max-width: 980px) { .ring-layout { grid-template-columns: 1fr; } }
  .detail-photo {
    width: 108px; height: 148px; border-radius: var(--radius-sm); overflow: hidden;
    border: 1px solid var(--line-strong); flex: none; background: var(--surface-2);
  }
  .detail-photo img { width: 100%; height: 100%; object-fit: cover; }
  .detail-top { display: flex; gap: 18px; }
  .medal-list { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; padding-right: 6px; }
  .medal-row { display: flex; gap: 10px; font-size: 13.5px; padding: 9px 12px; border-radius: var(--radius-sm);
    background: rgba(232,230,227,0.045); border: 1px solid var(--line); align-items: baseline; }
  .medal-row .yr { font-family: var(--mono); color: var(--gold); flex: none; width: 46px; }
  .medal-row .ev { color: var(--text); }
  .medal-row .tm { color: var(--faint); font-size: 12px; margin-left: auto; }
  .hall-strip { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
  .hall-strip .tag { cursor: pointer; transition: all .25s var(--ease); }
  .hall-strip .tag:hover { border-color: var(--accent); color: #fff; }
  .hall-strip .tag.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .hint { text-align: center; color: var(--faint); font-size: 12.5px; margin-top: 14px; font-family: var(--mono); letter-spacing: 1.5px; }
</style>
</head>
<body>
<section class="page">
  <div class="wrap">
    <div class="sec-head">
      <div class="lede">HALL 02 · RING GALLERY</div>
      <h2>344 位中国奥运冠军</h2>
      <p>从许海峰到巴黎的少年们。拖动胶片环，正面卡即选中；下方展示 TA 的全部夺金记录。按项目筛选你心中的传奇。</p>
    </div>
    <div class="seg" id="filter">
      <button data-k="multi" class="on">多金传奇</button>
      <button data-k="跳水">跳水梦之队</button>
      <button data-k="乒乓球">国乒</button>
      <button data-k="举重">大力士</button>
      <button data-k="体操">体操</button>
      <button data-k="射击">神枪手</button>
      <button data-k="冬季">冬奥之星</button>
      <button data-k="1984">洛杉矶首金一代</button>
    </div>
    <div class="ring-layout">
      <div>
        <div id="ring"></div>
        <div class="hint">← 拖拽旋转 / 点击侧卡对齐 →</div>
      </div>
      <div class="detail-panel" id="detail">
        <div class="detail-top">
          <div class="detail-photo" id="d-photo"></div>
          <div>
            <h3 id="d-name">—</h3>
            <div class="badge-row" id="d-tags"></div>
          </div>
        </div>
        <p id="d-summary" style="color:var(--muted); font-size:13.5px; margin-top:10px;"></p>
        <div class="medal-list" id="d-medals"></div>
      </div>
    </div>
  </div>
</section>
<script src="js/components.js"></script>
<script>
(async () => {
  const [athletes, medals, photoManifest] = await Promise.all([
    loadJSON("champions_athletes.json"), loadJSON("champions_master.json"), loadJSON("photos_manifest.json")]);
  const roster = new Map(athletes.map(a => [a.name, a]));
  const photoOf = (n) => (photoManifest[n] || {}).file;

  const FILTERS = {
    "multi": athletes.filter(a => a.gold_medals >= 3).map(a => ({ name: a.name, photo: photoOf(a.name) })),
    "跳水": athletes.filter(a => a.sports.includes("跳水")).map(a => ({ name: a.name, photo: photoOf(a.name) })),
    "乒乓球": athletes.filter(a => a.sports.includes("乒乓球")).map(a => ({ name: a.name, photo: photoOf(a.name) })),
    "举重": athletes.filter(a => a.sports.includes("举重")).map(a => ({ name: a.name, photo: photoOf(a.name) })),
    "体操": athletes.filter(a => a.sports.includes("体操")).map(a => ({ name: a.name, photo: photoOf(a.name) })),
    "射击": athletes.filter(a => a.sports.includes("射击")).map(a => ({ name: a.name, photo: photoOf(a.name) })),
    "冬季": athletes.filter(a => a.games.some(g => ["2002","2006","2010","2014","2018","2022"].includes(g))).map(a => ({ name: a.name, photo: photoOf(a.name) })),
    "1984": athletes.filter(a => a.games.includes("1984")).map(a => ({ name: a.name, photo: photoOf(a.name) })),
  };
  // 环上最多 18 张（半径可控，避免溢出压到详情面板），多余按序抽样
  function pick(arr) {
    if (arr.length <= 14) return arr;
    const step = arr.length / 14; const out = [];
    for (let i = 0; i < 14; i++) out.push(arr[Math.floor(i * step)]);
    return out;
  }

  function showDetail(name) {
    const a = roster.get(name);
    const ms = medals.filter(m => (m.athlete.split("/") || []).includes(name) || (m.team_members || []).includes(name));
    document.getElementById("d-name").textContent = name;
    const tags = [`<span class="tag gold">${a.gold_medals} 枚金牌</span>`]
      .concat(a.sports.map(s => `<span class="tag">${s}</span>`))
      .concat(a.games.map(g => `<span class="tag" style="background:rgba(232,230,227,.06);color:var(--muted);border-color:var(--line)">${g}</span>`));
    document.getElementById("d-tags").innerHTML = tags.join("");
    document.getElementById("d-summary").textContent =
      ms.length ? `共 ${ms.length} 次夺金时刻，最早可追溯至 ${ms[ms.length-1].year} 年。` : "";
    document.getElementById("d-medals").innerHTML = ms.map(m => `
      <div class="medal-row">
        <span class="yr">${m.year}</span>
        <span class="ev">${m.event}</span>
        <span class="tm">${m.games}</span>
      </div>`).join("");
    const ph = document.getElementById("d-photo");
    ph.innerHTML = "";
    ph.appendChild(personVisual({ name, photo: photoOf(name) }, "d-photo-inner"));
    const img = ph.querySelector("img");
    if (img) { img.style.width = "100%"; img.style.height = "100%"; img.style.objectFit = "cover"; }
  }

  let ring = null;
  function build(key) {
    const items = pick(FILTERS[key] || FILTERS.multi);
    document.getElementById("ring").innerHTML = "";
    ring = new RingGallery(document.getElementById("ring"), items, {
      cardWidth: 148, minCards: Math.max(14, items.length), margin: 60,
      onFront: (src) => { if (src != null) showDetail(items[src % items.length].name); }
    });
    showDetail(items[0].name);
  }
  document.getElementById("filter").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#filter button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    build(b.dataset.k);
  });
  build("multi");

  setTimeout(() => {
    const st = document.getElementById("ring");
    const tilt = st.querySelector(".rgs-tilt");
    const cs = getComputedStyle(st);
    const ct = getComputedStyle(tilt);
    const cr = getComputedStyle(st.querySelector(".rgs-ring"));
    const d = document.createElement("div"); d.id = "ring-debug2";
    d.textContent = "DBG2|" + JSON.stringify({
      cls: st.className, perspective: cs.perspective, oflow: cs.overflow,
      tiltTf: ct.transform.slice(0, 60), tiltStyle: ct.transformStyle,
      ringTf: cr.transform.slice(0, 80), ringStyle: cr.transformStyle,
      slotCount: st.querySelectorAll(".rgs-slot").length
    });
    document.body.appendChild(d);
  }, 2500);



})();
</script>
</body>
</html>
